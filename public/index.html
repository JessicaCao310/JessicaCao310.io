<title>Claw! — an arcade crane game</title>
<style>
  :root {
    --bg: #1a0f2e;
    --bg-2: #2a1650;
    --cabinet: #ff3d81;
    --cabinet-dark: #c81e5e;
    --glass-top: #26123f;
    --glass-bot: #3a1d63;
    --neon: #43e8ff;
    --neon-soft: #43e8ff55;
    --gold: #ffd23f;
    --white: #fff6ff;
    --ink: #f6ecff;
    --ink-soft: #b79fd6;
    --chute: #150a26;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg-2), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .machine {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, var(--cabinet), var(--cabinet-dark));
    border-radius: 26px;
    padding: 14px;
    box-shadow:
      0 0 0 3px #ffffff22 inset,
      0 30px 60px -20px #000a,
      0 0 60px -10px var(--cabinet);
    user-select: none;
  }

  .marquee { text-align: center; padding: 12px 8px 14px; }
  .marquee h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: 40px;
    letter-spacing: .04em;
    color: var(--white);
    text-shadow: 0 0 8px var(--neon), 0 0 20px var(--neon), 0 2px 0 var(--cabinet-dark);
    text-transform: uppercase;
  }
  .marquee p {
    margin: 2px 0 0;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #ffe3f0;
  }

  .glass {
    position: relative;
    height: 380px;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--glass-top), var(--glass-bot));
    box-shadow: 0 0 0 4px #10061e inset, 0 0 26px var(--neon-soft) inset;
    overflow: hidden;
  }
  .rail {
    position: absolute; left: 0; right: 0; top: 14px; height: 4px;
    background: linear-gradient(90deg, #ffffff10, var(--neon), #ffffff10);
    box-shadow: 0 0 8px var(--neon);
  }
  .cable {
    position: absolute; top: 16px; width: 3px;
    background: linear-gradient(180deg, #ffffffcc, #ffffff44);
    transform: translateX(-50%);
    height: 30px; z-index: 3;
  }
  .claw {
    position: absolute; z-index: 4;
    width: 46px; height: 34px;
    transform: translate(-50%, 0);
    pointer-events: none;
  }
  .claw .hub {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
    width: 20px; height: 12px; border-radius: 5px;
    background: linear-gradient(180deg, #eaeaf2, #9aa0c0);
    box-shadow: 0 1px 3px #0008;
  }
  .claw .arm {
    position: absolute; top: 4px; width: 8px; height: 30px;
    background: linear-gradient(180deg, #d7dbee, #8b90b4);
    border-radius: 4px 4px 6px 6px;
    transition: transform .18s ease;
  }
  .claw .arm.l { left: 6px; transform-origin: top center; transform: rotate(20deg); }
  .claw .arm.r { right: 6px; transform-origin: top center; transform: rotate(-20deg); }
  .claw.closed .arm.l { transform: rotate(6deg); }
  .claw.closed .arm.r { transform: rotate(-6deg); }

  .prize {
    position: absolute; z-index: 2;
    font-size: 34px; line-height: 1;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 4px #0006);
  }
  .prize.bonus {
    font-size: 15px; font-weight: 800; font-family: var(--display);
    color: #3a2400;
    background: linear-gradient(180deg, #ffe680, #ffc21f);
    padding: 6px 9px 7px; border-radius: 9px; letter-spacing: .02em;
    border: 2px solid #fff3c0;
    box-shadow: 0 3px 0 #a06f00, 0 0 14px -2px var(--gold);
    white-space: nowrap; filter: none;
  }

  .chute {
    position: absolute; left: 10px; bottom: 8px; z-index: 1;
    width: 82px; height: 30px;
    background: var(--chute);
    border-radius: 8px;
    box-shadow: 0 0 0 3px #000a inset;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
    background: linear-gradient(180deg, #ffffff08, #00000030);
    border-top: 2px solid #ffffff14;
  }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 6px 4px;
    font-variant-numeric: tabular-nums;
  }
  .hud .label { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #ffe3f0; }
  .hud .val { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--white); }
  .hud .gold { color: var(--gold); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    gap: 10px;
    padding: 8px 6px 6px;
  }
  button {
    font-family: var(--display);
    font-weight: 700;
    border: none;
    border-radius: 14px;
    padding: 16px 10px;
    cursor: pointer;
    color: var(--white);
    background: #ffffff1f;
    box-shadow: 0 4px 0 #00000030, 0 0 0 2px #ffffff22 inset;
    transition: transform .06s, background .15s;
    font-size: 16px;
    touch-action: manipulation;
  }
  button:hover { background: #ffffff30; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #00000030, 0 0 0 2px #ffffff22 inset; }
  button.drop {
    background: linear-gradient(180deg, var(--gold), #e6a800);
    color: #3a2400;
    letter-spacing: .06em;
    box-shadow: 0 4px 0 #a06f00, 0 0 18px -2px var(--gold);
  }
  button.drop:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--neon); outline-offset: 2px; }

  .msg {
    text-align: center;
    min-height: 1.4em;
    padding: 6px 6px 10px;
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: .02em;
  }
  @media (prefers-reduced-motion: reduce) { .claw .arm { transition: none; } }
</style>

<main class="machine" aria-label="Claw machine game">
  <div class="marquee">
    <h1>Claw!</h1>
    <p>Center the claw &middot; grab a &#127903; sign for extra tries</p>
  </div>

  <div class="glass" id="glass">
    <div class="rail"></div>
    <div class="cable" id="cable"></div>
    <div class="claw" id="claw">
      <span class="hub"></span>
      <span class="arm l"></span>
      <span class="arm r"></span>
    </div>
    <div class="floor"></div>
    <div class="chute">Prize chute</div>
  </div>

  <div class="hud">
    <div><div class="label">Prizes</div><div class="val gold" id="score">0</div></div>
    <div style="text-align:right"><div class="label">Tries left</div><div class="val" id="tries">10</div></div>
  </div>

  <div class="controls">
    <button id="leftBtn" aria-label="Move claw left">&#9664;</button>
    <button id="dropBtn" class="drop">DROP</button>
    <button id="rightBtn" aria-label="Move claw right">&#9654;</button>
  </div>

  <p class="msg" id="msg">Dead-center grabs hold best. Snag a &#127903; sign for bonus tries!</p>
</main>

<script>
  const ANIMALS = ["🧸","🐰","🐼","🐨","🐤","🐧","🦊","🐮","🐷","🐵","🦁","🐯","🐹","🐻"];

  const glass = document.getElementById("glass");
  const clawEl = document.getElementById("claw");
  const cableEl = document.getElementById("cable");
  const scoreEl = document.getElementById("score");
  const triesEl = document.getElementById("tries");
  const msgEl = document.getElementById("msg");
  const dropBtn = document.getElementById("dropBtn");
  const leftBtn = document.getElementById("leftBtn");
  const rightBtn = document.getElementById("rightBtn");

  // --- tuning: harder + more realistic ----------------------------------
  const REST_Y = 44;
  const GRAB_RADIUS = 34;      // px horizontal reach
  const SPEED_DROP = 4.2;
  const SPEED_LIFT = 3.6;
  const GLIDE = 0.14;
  const MAX_GRIP = 0.78;       // best-case hold chance, dead center
  const SLIP_CHANCE = 0.20;    // chance a held prize drops mid-carry
  const BONUS_TRIES = 4;       // tries awarded by a 🎟 sign

  let W = glass.clientWidth;
  const floorY = () => glass.clientHeight - 40;

  let cx = 0.5, targetCx = 0.5;
  let clawY = REST_Y;
  let state = "ready";
  let held = null, heldPrize = null, slipX = null;
  let score = 0, tries = 10;
  const chuteCx = () => (10 + 41) / W;

  // --- prize pile --------------------------------------------------------
  let prizes = [];
  function makePrize(xf, type) {
    const el = document.createElement("span");
    el.className = "prize" + (type === "bonus" ? " bonus" : "");
    if (type === "bonus") el.textContent = "+" + BONUS_TRIES + " 🎟";
    else el.textContent = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
    glass.appendChild(el);
    const p = { el, xf, held: false, bonus: type === "bonus" };
    prizes.push(p);
    return p;
  }
  function seedPile() {
    prizes.forEach(p => p.el.remove());
    prizes = [];
    const n = 7;
    for (let i = 0; i < n; i++) {
      const xf = 0.16 + (i / (n - 1)) * 0.68 + (Math.random() - 0.5) * 0.04;
      makePrize(xf, i === 3 ? "bonus" : "animal"); // one sign in the pile
    }
  }
  function refill() {
    const sitting = prizes.filter(p => !p.held);
    if (sitting.length < 6) {
      const xf = 0.16 + Math.random() * 0.68;
      const hasBonus = prizes.some(p => p.bonus && !p.held);
      makePrize(xf, (!hasBonus && Math.random() < 0.4) ? "bonus" : "animal");
    }
  }

  // --- rendering ---------------------------------------------------------
  function layout() {
    W = glass.clientWidth;
    const px = cx * W;
    clawEl.style.left = px + "px";
    clawEl.style.top = clawY + "px";
    cableEl.style.left = px + "px";
    cableEl.style.height = (clawY - 16) + "px";
    const fy = floorY();
    prizes.forEach(p => {
      if (p.held) { p.el.style.left = px + "px"; p.el.style.top = (clawY + 30) + "px"; }
      else { p.el.style.left = (p.xf * W) + "px"; p.el.style.top = fy + "px"; }
    });
  }

  // --- grip model: closer to center = far stronger hold ------------------
  function gripChance(distPx) {
    const align = Math.max(0, 1 - distPx / GRAB_RADIUS); // 1 center -> 0 edge
    return align * align * MAX_GRIP;                       // squared: edges rarely hold
  }

  // --- game loop ---------------------------------------------------------
  let grabTimer = 0;
  function tick() {
    if (state === "ready") {
      cx += (targetCx - cx) * GLIDE;
      clawY += (REST_Y - clawY) * 0.2;
    } else if (state === "drop") {
      clawY += SPEED_DROP;
      if (clawY >= floorY() - 6) { clawY = floorY() - 6; state = "grab"; grabTimer = 14; attemptGrab(); }
    } else if (state === "grab") {
      if (--grabTimer <= 0) state = "lift";
    } else if (state === "lift") {
      clawY -= SPEED_LIFT;
      if (clawY <= REST_Y) {
        clawY = REST_Y;
        if (held) state = "carry";
        else { state = "ready"; enableControls(true); endTurn("miss"); }
      }
    } else if (state === "carry") {
      targetCx = chuteCx();
      cx += (targetCx - cx) * GLIDE;
      if (slipX !== null && cx <= slipX) {
        // the notorious claw-machine slip
        slipX = null;
        heldPrize.held = false; heldPrize.xf = cx; // drops where it currently is
        held = null; heldPrize = null;
        clawEl.classList.remove("closed");
        state = "ready"; enableControls(true);
        endTurn("slip");
      } else if (Math.abs(cx - targetCx) < 0.01) {
        cx = targetCx; state = "dropin";
      }
    } else if (state === "dropin") {
      if (held) {
        held._fall = (held._fall || 0) + 6;
        held.style.top = (clawY + 30 + held._fall) + "px";
        held.style.opacity = String(Math.max(0, 1 - held._fall / 50));
        if (held._fall > 50) {
          const wasBonus = heldPrize && heldPrize.bonus;
          held.remove();
          prizes = prizes.filter(p => p.el !== held);
          held = null; heldPrize = null;
          clawEl.classList.remove("closed");
          refill();
          state = "ready"; enableControls(true);
          endTurn(wasBonus ? "bonus" : "win");
        }
      }
    }
    layout();
    requestAnimationFrame(tick);
  }

  function attemptGrab() {
    clawEl.classList.add("closed");
    const px = cx * W;
    let best = null, bestD = Infinity;
    prizes.forEach(p => {
      if (p.held) return;
      const d = Math.abs(p.xf * W - px);
      if (d < GRAB_RADIUS && d < bestD) { bestD = d; best = p; }
    });
    slipX = null;
    if (best && Math.random() < gripChance(bestD)) {
      best.held = true; held = best.el; heldPrize = best;
      // maybe it will slip on the way to the chute
      if (Math.random() < SLIP_CHANCE) {
        const lo = chuteCx() + 0.07;
        if (cx - lo > 0.04) slipX = lo + Math.random() * (cx - lo - 0.02);
      }
    } else {
      setTimeout(() => { if (!held) clawEl.classList.remove("closed"); }, 250);
    }
  }

  function drop() {
    if (state !== "ready" || tries <= 0) return;
    enableControls(false);
    state = "drop";
  }

  function endTurn(result) {
    tries = Math.max(0, tries - 1);           // every drop costs a try
    if (result === "win") {
      score++; scoreEl.textContent = score;
      msgEl.textContent = pick(["Nice grab! 🎉", "Got one! 🏆", "Clean pick. 🎯", "Winner! ✨"]);
    } else if (result === "bonus") {
      tries += BONUS_TRIES;
      msgEl.textContent = `🎟 Sign secured — +${BONUS_TRIES} tries!`;
    } else if (result === "slip") {
      msgEl.textContent = pick(["It slipped out! 😩", "Aww — dropped at the last second.", "So close, it wiggled free."]);
    } else {
      msgEl.textContent = pick(["Missed — line it up dead center.", "No grip that time.", "Nudge it closer and try again."]);
    }
    triesEl.textContent = tries;
    if (tries <= 0) gameOver();
  }

  function gameOver() {
    enableControls(false);
    dropBtn.textContent = "PLAY AGAIN";
    dropBtn.disabled = false;
    dropBtn.dataset.restart = "1";
    msgEl.textContent = `Out of tries — you won ${score} ${score === 1 ? "prize" : "prizes"}! Play again?`;
  }

  function restart() {
    score = 0; tries = 10; held = null; heldPrize = null; slipX = null;
    scoreEl.textContent = 0; triesEl.textContent = 10;
    dropBtn.textContent = "DROP";
    delete dropBtn.dataset.restart;
    clawEl.classList.remove("closed");
    seedPile();
    state = "ready"; enableControls(true);
    msgEl.textContent = "Dead-center grabs hold best. Grab a 🎟 sign for bonus tries!";
  }

  function enableControls(on) { leftBtn.disabled = !on; rightBtn.disabled = !on; dropBtn.disabled = !on; }
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // --- input -------------------------------------------------------------
  const STEP = 0.055;
  leftBtn.addEventListener("click", () => { if (state === "ready") targetCx = Math.max(0.08, targetCx - STEP); });
  rightBtn.addEventListener("click", () => { if (state === "ready") targetCx = Math.min(0.92, targetCx + STEP); });
  dropBtn.addEventListener("click", () => { if (dropBtn.dataset.restart) restart(); else drop(); });

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { if (state === "ready") targetCx = Math.max(0.08, targetCx - STEP); }
    else if (e.key === "ArrowRight") { if (state === "ready") targetCx = Math.min(0.92, targetCx + STEP); }
    else if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (dropBtn.dataset.restart) restart(); else drop();
    }
  });

  window.addEventListener("resize", layout);

  seedPile();
  layout();
  requestAnimationFrame(tick);
</script>
